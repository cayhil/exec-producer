[project]
name = "exec-producer"
version = "0.1.0"
description = "Autonomous multi-agent reality show engine — a director LLM orchestrates a cast of character LLMs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "litellm>=1.83.0,<1.92",
    "python-dotenv>=1.2.2",
]

[project.scripts]
exec-producer = "exec_producer.bootstrap:main"

[project.optional-dependencies]
audio = [
    "elevenlabs>=2.0.0",
]
video = [
    "pillow>=11.0",
]
veo = [
    "google-genai>=2.12.1",
]
planner = [
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]
